<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' http://127.0.0.1:3001 http://localhost:*; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; connect-src 'self' http://127.0.0.1:3001 http://localhost:*"
    />
    <title>Electron 桌面应用</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">E</div>
      <p class="eyebrow">桌面应用已就绪</p>
      <h1>你好，Electron</h1>
      <p class="description">
        这是你的 Electron 项目起点。现在可以开始构建跨平台桌面应用了。
      </p>
      <div class="details">
        <span class="label">运行平台</span>
        <span id="platform">正在读取…</span>
      </div>
      <p class="versions" id="versions"></p>
      <button id="selectBut">查询</button>
      <span id="dataId"></span>
      <button id="renderProcess">查询渲染进程</button>
    </main>

    <main class="card">
      <h2>Web Worker 通信演示</h2>
      <div>
        <button id="workerPing">Ping</button>
        <button id="workerEcho">Echo</button>
        <button id="workerSum">Sum 10k</button>
        <button id="workerSumProgress">Sum 100w (带进度)</button>
        <button id="workerFib">Fib(10000)</button>
        <button id="workerDelay">Delay 500ms</button>
        <button id="workerTerminate">终止 Worker</button>
      </div>
      <div id="workerLog" style="margin-top:10px;max-height:200px;overflow-y:auto;border:1px solid #ccc;padding:6px;font-family:monospace;font-size:12px;"></div>
    </main>

    <main class="card">
      <h2>应用更新</h2>
      <p class="description" id="updateStatus">尚未检查更新</p>
      <div>
        <button id="updateCheckBtn">检查更新</button>
        <button id="updateDownloadBtn" disabled>下载更新</button>
        <button id="updateInstallBtn" disabled>重启并安装</button>
        <button id="" >重启</button>
      </div>
    </main>

    <main class="card">
      <h2>前端热更新（仅测试用）</h2>
      <p class="description">从本地更新服务（http://127.0.0.1:3001）拉取 index.html / renderer.js / styles.css，写入 userData/patches/&lt;version&gt;/ 并刷新。</p>
      <div>
        <button id="hotUpdateApplyBtn">应用热更新</button>
        <button id="hotUpdateClearBtn">清除热更新补丁</button>
      </div>
      <div id="hotUpdateResult" style="margin-top:10px;min-height:40px;border:1px solid #ccc;padding:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;"></div>
    </main>

    <main class="card">
      <h2>配置读写演示</h2>
      <div>
        <input id="configInput" type="text" style="width:320px;" placeholder='输入 JSON，如 {"theme":"dark","fontSize":14}' value='{"theme":"dark","fontSize":14}' />
        <button id="configLoadBtn">读取配置</button>
        <button id="configSaveBtn">保存配置</button>
      </div>
      <div id="configResult" style="margin-top:10px;min-height:40px;border:1px solid #ccc;padding:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;"></div>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
